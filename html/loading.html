<html>
	<head>
		<title>Loading..</title>
		<link rel="stylesheet" type="text/css" href="loading.css" />
		<style>

			#nf_loading {
				position: fixed;
				right: 24px;
				top: calc(28px + (var(--vuo-vh, 1vh) * 100 - 56px) * var(--ld-y, 1));
				transform: translateY(calc(-100% * var(--ld-y, 1)));

				background: rgba(0, 0, 0, 0.70);
				border: 1px solid rgba(255, 255, 255, 0.05);
				border-radius: 5px;
				padding: 14px 16px 12px 16px;
				display: flex;
				flex-direction: row;
				align-items: center;
				gap: 12px;
				z-index: 99999;
				pointer-events: none;
				font-family: 'Roboto', 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
				box-shadow:
					0 4px 24px rgba(0, 0, 0, 0.60),
					inset 0 1px 0 rgba(255, 255, 255, 0.04);
			}

			#nf_info {
				display: flex;
				flex-direction: column;
				gap: 10px;
				width: var(--ld-w, 280px);
			}

			#nf_status {
				font-size: var(--ld-text, 13px);
				font-weight: 500;
				color: rgba(225, 238, 255, 0.90);
				letter-spacing: 0.06em;
				text-shadow: 0 1px 6px rgba(0, 0, 0, 0.90);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				line-height: 1.4;
			}

			#nf_cancel {
				font-size: calc(var(--ld-text, 13px) * 0.77);
				width: 6.6em;
				height: 2.2em;
				flex-shrink: 0;
				font-weight: 500;
				color: rgba(210, 225, 248, 0.85);
				letter-spacing: 0.06em;
				border-radius: 4px;
				border: 1px solid rgba(255, 255, 255, 0.12);
				background: rgba(255, 255, 255, 0.04);
				display: flex;
				align-items: center;
				justify-content: center;
				pointer-events: auto;
				cursor: pointer;
				user-select: none;
				-webkit-user-select: none;
				transition: background 0.15s, border-color 0.15s, color 0.15s;
			}

			#nf_cancel:hover {
				background: rgba(255, 255, 255, 0.10);
				border-color: rgba(255, 255, 255, 0.24);
				color: #ffffff;
			}

			#nf_cancel:active {
				background: rgba(255, 255, 255, 0.16);
			}

			#nf_track {
				width: 100%;
				height: var(--ld-bar, 7px);
				background: rgba(255, 255, 255, 0.07);
				border-radius: 9999px;
				overflow: hidden;
			}

			#nf_fill {
				height: 100%;
				width: 0%;
				border-radius: 9999px;
				background: rgba(var(--vuo-a, 35, 135, 237), 0.95);
				box-shadow: 0 0 10px rgba(var(--vuo-a, 35, 135, 237), 0.70);
				transition: width 0.40s cubic-bezier(0.4, 0, 0.2, 1);
			}

		</style>
	</head>
	<body class="vuo-loading">

		<div id="background">
			<div id="container">
				<img id="logo" src='img/gmod_logo_brave.png'/>
				<div>
					<div class="walk">:v</div>
				</div>
			</div>

			<div class="server_info">
				<img id="mapimg" src="asset://mapimage/invalid_map" />
				<div class="text">
					<div id="serverName">Server</div>
					<div id="serverMap">gm_construct</div>
					<div id="serverGamemode">Sandbox</div>
				</div>
			</div>

			<div id="spambox"></div>
		</div>

		<div id="nf_loading">
			<div id="nf_info">
				<div id="nf_status">Connecting...</div>
				<div id="nf_track">
					<div id="nf_fill"></div>
				</div>
			</div>
			<div id="nf_cancel">Cancel</div>
		</div>

		<script type="text/javascript">

			document.addEventListener('DOMContentLoaded', function() {
				document.body.classList.add('dark');
			});

			document.getElementById('nf_cancel').addEventListener('click', function() {
				document.title = 'NF_CANCEL';
				setTimeout(function() { document.title = 'Loading..'; }, 400);
			});

			function SetLoadingFraction(f) {
				var fill = document.getElementById('nf_fill');
				if (fill) fill.style.width = (Math.max(0, Math.min(1, f)) * 100) + '%';
			}

			function SetStatusChanged(status) {
				var el = document.getElementById('nf_status');
				if (el && status) el.innerText = status;
			}

			function nfLoadServer(url) {
				var existing = document.getElementById('nf_server_frame');
				if (existing) existing.parentNode.removeChild(existing);

				var frame = document.createElement('iframe');
				frame.id = 'nf_server_frame';
				frame.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:99990;display:block;background:#000;opacity:0;transition:opacity 0.35s ease;';
				var shown = false;
				var show = function() {
					if (shown) return;
					shown = true;
					frame.style.opacity = '1';
				};
				frame.addEventListener('load', function() { setTimeout(show, 150); });
				setTimeout(show, 3000);
				frame.src = url;
				document.body.appendChild(frame);
			}

			function SetFilesNeeded(n) {}
			function SetFilesTotal(n) {
				if (n > 0) document.getElementById('nf_status').innerText = window.nfTxtFiles || 'Downloading files...';
			}
			function DownloadingFile(file) {
				var el = document.getElementById('nf_status');
				if (el && file) {

					var short = file.split('/').pop();
					el.innerText = short;
				}
			}

			function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, lang, gamemodeNice) {
				var mapImg = "asset://mapimage/" + mapname;
				document.querySelector("#serverName").innerText = servername;
				document.querySelector("#serverMap").innerText = mapname;
				document.querySelector("#serverGamemode").innerText = gamemodeNice;
				document.querySelector("#mapimg").setAttribute("src", mapImg);

				document.body.style.backgroundImage = "url('" + mapImg + "')";
				document.querySelector(".server_info").classList.add("visible");
			}

		</script>

	</body>
</html>
